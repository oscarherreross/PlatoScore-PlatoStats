# Datos legales de PlatoScore y PlatoStats. Es el único sitio donde se rellenan: de
# aquí salen las páginas de docs/ (política de privacidad y eliminación de cuenta) y
# el enlace a la política que muestran las apps. Mientras conserven estos marcadores
# no se pueden generar esas páginas ni el paquete de publicación. Ver PUBLICACION.md.
#
# El archivo se lee como UTF-8: los nombres con tildes o eñes se escriben tal cual.

# Quién responde del tratamiento de los datos (persona o entidad).
responsable=NOMBRE_DEL_RESPONSABLE

# Correo público al que escribir sobre privacidad o para pedir el borrado de una cuenta.
contacto=CORREO_DE_CONTACTO

# Dirección donde se publica la carpeta docs/, sin barra final
# (por ejemplo, https://usuario.github.io/repositorio).
urlBase=URL_DE_LAS_PAGINAS_LEGALES
