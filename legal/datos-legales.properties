# Datos legales de PlatoScore y PlatoStats. Es el único sitio donde se rellenan: con
# ellos se completan la política de privacidad y la página de eliminación de cuenta,
# tanto las que van dentro de las apps como las que se generan en docs/ para la web.
# Mientras conserven estos marcadores, las apps muestran «(pendiente de indicar)» y no
# se pueden generar las páginas web ni el paquete de publicación. Ver PUBLICACION.md.
#
# El archivo se lee como UTF-8: los nombres con tildes o eñes se escriben tal cual.

# Quién responde del tratamiento de los datos (persona o entidad).
responsable=NOMBRE_DEL_RESPONSABLE

# Correo público al que escribir sobre privacidad o para pedir el borrado de una cuenta.
contacto=CORREO_DE_CONTACTO
